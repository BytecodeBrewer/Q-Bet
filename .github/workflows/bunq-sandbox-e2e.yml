name: bunq Sandbox E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    types:
      - labeled

permissions:
  contents: read

jobs:
  bunq-sandbox-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.label.name == 'qbet:approved' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    name: bunq sandbox balance and payment
    runs-on: ubuntu-latest
    environment: bunq-sandbox
    env:
      API_KEY_BUNQ: ${{ secrets.API_KEY_BUNQ }}
      QBET_BUNQ_MODE: sandbox
      QBET_BUNQ_ACCOUNT_REFERENCE: ${{ vars.QBET_BUNQ_ACCOUNT_REFERENCE }}
      QBET_BUNQ_SANDBOX_RECIPIENT_EMAIL: ${{ secrets.QBET_BUNQ_SANDBOX_RECIPIENT_EMAIL }}
      QBET_BUNQ_E2E: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sandbox configuration
        shell: bash
        run: |
          test -n "$API_KEY_BUNQ" || {
            echo "Missing API_KEY_BUNQ in the bunq-sandbox environment"
            exit 1
          }
          test -n "$QBET_BUNQ_ACCOUNT_REFERENCE" || {
            echo "Missing QBET_BUNQ_ACCOUNT_REFERENCE in the bunq-sandbox environment"
            exit 1
          }
          test -n "$QBET_BUNQ_SANDBOX_RECIPIENT_EMAIL" || {
            echo "Missing QBET_BUNQ_SANDBOX_RECIPIENT_EMAIL in the bunq-sandbox environment"
            exit 1
          }

      - name: Install Q-Bet with bunq SDK
        run: python -m pip install '.[bunq]' -r requirements-dev.txt

      - name: Run bunq sandbox E2E
        run: python -m pytest tests/e2e/bunq -m bunq_e2e -q
