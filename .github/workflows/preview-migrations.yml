name: Preview migration operator

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref whose committed Django migrations should be applied
        required: true
        default: develop
        type: string

permissions:
  contents: read

jobs:
  migrate-preview:
    name: Apply Preview Django migrations
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref }}

      - name: Record operator-selected release
        shell: bash
        run: |
          echo "Applying Preview migrations from $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Vercel operator configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Link Preview environment without exporting database secrets
        run: vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Show Preview migration plan
        run: >-
          vercel env run -e preview --token "$VERCEL_TOKEN" --
          python manage.py migrate --plan

      - name: Apply Preview migrations
        run: >-
          vercel env run -e preview --token "$VERCEL_TOKEN" --
          python manage.py migrate --noinput

      - name: Verify Preview migration state
        run: >-
          vercel env run -e preview --token "$VERCEL_TOKEN" --
          python manage.py migrate --check
