name: Validation

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read
  deployments: write

jobs:
  validation:
    name: PostgreSQL validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbet
          POSTGRES_PASSWORD: qbet
          POSTGRES_DB: qbet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbet -d qbet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_test
      QBET_TEST_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_test
      QBET_BUNQ_E2E: "0"
      QBET_RUN_PERFORMANCE: "0"
      QBET_SIMULATION_SPORTS_SOURCE: fixture
      QBET_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact validation head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "::error::Validation checkout $actual_sha does not match expected head $EXPECTED_SHA"
            exit 1
          }
          echo "Validated exact head: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Check pull request patch
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Check pushed patch
        if: github.event_name == 'push'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git diff --check HEAD^...HEAD
          else
            git diff --check "$before...${{ github.sha }}"
          fi
      - name: Verify isolated offline test boundary
        shell: bash
        run: |
          test "$QBET_BUNQ_E2E" = "0"
          test "$QBET_RUN_PERFORMANCE" = "0"
          test "$QBET_SIMULATION_SPORTS_SOURCE" = "fixture"
          test -z "${API_KEY_BUNQ:-}"
      - name: Verify PostgreSQL test target
        shell: bash
        run: |
          python - <<'PY'
          from qbet.web.settings import DATABASES

          database = DATABASES["default"]
          assert database["ENGINE"] == "django.db.backends.postgresql"
          assert database["HOST"] == "127.0.0.1"
          assert database["PORT"] == 5432
          assert database["NAME"] == "qbet_test"
          PY
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run Pyright
        run: python -m pyright
      - name: Check committed migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Verify migration plan is current
        run: python manage.py migrate --check
      - name: Run full standard Pytest suite
        run: python -m pytest
      - name: Check Django configuration
        run: python manage.py check
      - name: Build distribution
        run: python -m build
      - name: Upload develop distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: q-bet-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  performance:
    name: Phase 3 performance baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbet
          POSTGRES_PASSWORD: qbet
          POSTGRES_DB: qbet_performance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbet -d qbet_performance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_performance
      QBET_TEST_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_performance
      QBET_RUN_PERFORMANCE: "1"
      QBET_PERFORMANCE_OUTPUT: artifacts/phase3-performance-baseline.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run performance baseline
        run: python -m pytest -m performance tests/performance -s
      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: phase3-performance-baseline-${{ github.sha }}
          path: artifacts/phase3-performance-baseline.json
          if-no-files-found: error
          retention-days: 14

  vercel-build-check:
    name: Vercel build check
    needs:
      - validation
      - performance
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      EXPECTED_RELEASE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact Vercel build head
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_RELEASE" || {
            echo "::error::Vercel build checkout $actual_sha does not match expected head $EXPECTED_RELEASE"
            exit 1
          }
          echo "Checking Vercel buildability for exact head: $actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vercel Python build tooling
        run: python -m pip install uv

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Vercel build configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Pull Vercel preview build configuration
        run: vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build Vercel artifacts without deploying
        run: |
          vercel build --yes --token "$VERCEL_TOKEN"
          echo "Vercel build passed; no deployment was created." >> "$GITHUB_STEP_SUMMARY"

  deploy-develop:
    name: Vercel develop CD
    needs:
      - validation
      - performance
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://q-bet.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      QBET_DJANGO_SECRET_KEY: ${{ secrets.QBET_DJANGO_SECRET_KEY }}
      QBET_DATABASE_URL: ${{ secrets.QBET_MIGRATION_DATABASE_URL }}
      EXPECTED_RELEASE: ${{ github.sha }}
      STABLE_URL: https://q-bet.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact develop deploy head
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_RELEASE" || {
            echo "::error::Develop deployment checkout $actual_sha does not match expected head $EXPECTED_RELEASE"
            exit 1
          }
          echo "Preparing stable develop release: $actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies for deployment preflight
        run: |
          python -m pip install .
          python -m pip install uv

      - name: Verify shared schema before stable deployment
        env:
          QBET_DJANGO_DEBUG: "false"
        run: |
          python manage.py migrate --check
          echo "Shared PostgreSQL schema is compatible with $EXPECTED_RELEASE." >> "$GITHUB_STEP_SUMMARY"

      - name: Load protected polling token from Supabase Vault
        shell: bash
        run: |
          token="$(
            python - <<'PY'
          import os

          import psycopg

          with psycopg.connect(os.environ["QBET_DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select decrypted_secret
                      from vault.decrypted_secrets
                      where name = 'qbet_polling_tick_token'
                      """
                  )
                  row = cursor.fetchone()

          if row is None or not str(row[0]).strip():
              raise SystemExit("Q-Bet polling tick token is missing from Supabase Vault")

          print(row[0])
          PY
          )"
          echo "::add-mask::$token"
          echo "QBET_POLLING_TICK_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate stable deployment configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }
          test -n "$QBET_DJANGO_SECRET_KEY" || {
            echo "Missing QBET_DJANGO_SECRET_KEY secret"
            exit 1
          }

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Pull Vercel production build configuration
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build stable Vercel artifacts
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy exact develop build to stable Vercel
        id: deploy
        shell: bash
        run: |
          deployment_url="$(
            vercel deploy --prebuilt --prod --yes               --token "$VERCEL_TOKEN"               --env QBET_HOSTED_PREVIEW=false               --env QBET_DJANGO_DEBUG=false               --env QBET_DJANGO_ALLOWED_HOSTS=.vercel.app               --env QBET_DJANGO_SECRET_KEY="$QBET_DJANGO_SECRET_KEY"               --env QBET_POLLING_TICK_TOKEN="$QBET_POLLING_TICK_TOKEN"               --env QBET_RELEASE_SHA="$EXPECTED_RELEASE"               --env QBET_SIMULATION_MODE_ENABLED=false
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Stable Vercel deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify stable alias advanced to exact develop head
        shell: bash
        run: |
          health=""
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error "$STABLE_URL/health/" || true)"
            if printf '%s' "$health" | grep -Fq "\"release\": \"$EXPECTED_RELEASE\"" &&                printf '%s' "$health" | grep -Fq '"status": "ok"' &&                printf '%s' "$health" | grep -Fq '"persistence": "ready"' &&                printf '%s' "$health" | grep -Fq '"readiness": "ready"'; then
              echo "Stable alias serves exact develop release $EXPECTED_RELEASE." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Stable alias did not advance to healthy release $EXPECTED_RELEASE."
          printf 'Last health response: %s\n' "$health"
          exit 1
