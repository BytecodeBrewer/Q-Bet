name: Validation

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read
  deployments: write

jobs:
  validation:
    name: PostgreSQL validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbet
          POSTGRES_PASSWORD: qbet
          POSTGRES_DB: qbet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbet -d qbet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_test
      QBET_TEST_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_test
      QBET_BUNQ_E2E: "0"
      QBET_RUN_PERFORMANCE: "0"
      QBET_SIMULATION_SPORTS_SOURCE: fixture
      QBET_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact validation head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "::error::Validation checkout $actual_sha does not match expected head $EXPECTED_SHA"
            exit 1
          }
          echo "Validated exact head: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Check pull request patch
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Check pushed patch
        if: github.event_name == 'push'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git diff --check HEAD^...HEAD
          else
            git diff --check "$before...${{ github.sha }}"
          fi
      - name: Verify isolated offline test boundary
        shell: bash
        run: |
          test "$QBET_BUNQ_E2E" = "0"
          test "$QBET_RUN_PERFORMANCE" = "0"
          test "$QBET_SIMULATION_SPORTS_SOURCE" = "fixture"
          test -z "${API_KEY_BUNQ:-}"
      - name: Verify PostgreSQL test target
        shell: bash
        run: |
          python - <<'PY'
          from qbet.web.settings import DATABASES

          database = DATABASES["default"]
          assert database["ENGINE"] == "django.db.backends.postgresql"
          assert database["HOST"] == "127.0.0.1"
          assert database["PORT"] == 5432
          assert database["NAME"] == "qbet_test"
          PY
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run Pyright
        run: python -m pyright
      - name: Check committed migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Verify migration plan is current
        run: python manage.py migrate --check
      - name: Run full standard Pytest suite
        run: python -m pytest
      - name: Check Django configuration
        run: python manage.py check
      - name: Build distribution
        run: python -m build
      - name: Upload develop distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: q-bet-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  performance:
    name: Phase 3 performance baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbet
          POSTGRES_PASSWORD: qbet
          POSTGRES_DB: qbet_performance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbet -d qbet_performance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_performance
      QBET_TEST_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_performance
      QBET_RUN_PERFORMANCE: "1"
      QBET_PERFORMANCE_OUTPUT: artifacts/phase3-performance-baseline.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run performance baseline
        run: python -m pytest -m performance tests/performance -s
      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: phase3-performance-baseline-${{ github.sha }}
          path: artifacts/phase3-performance-baseline.json
          if-no-files-found: error
          retention-days: 14

  deploy-preview:
    name: Vercel preview
    needs:
      - validation
      - performance
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      QBET_DJANGO_SECRET_KEY: ${{ secrets.QBET_DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }
          test -n "$QBET_DJANGO_SECRET_KEY" || {
            echo "Missing QBET_DJANGO_SECRET_KEY secret"
            exit 1
          }

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Deploy hosted preview
        id: deploy
        shell: bash
        run: |
          deployment_url="$(
            vercel deploy --yes \
              --token "$VERCEL_TOKEN" \
              --env QBET_HOSTED_PREVIEW=true \
              --env QBET_DJANGO_DEBUG=false \
              --env QBET_DJANGO_ALLOWED_HOSTS=.vercel.app \
              --env QBET_DJANGO_SECRET_KEY="$QBET_DJANGO_SECRET_KEY" \
              --env QBET_SIMULATION_MODE_ENABLED=false
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Vercel preview: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test hosted preview
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          health="$(
            vercel curl /health/ \
              --deployment "$DEPLOYMENT_URL" \
              --silent
          )"
          printf 'Hosted readiness: %s\n' "$health"

          if printf '%s' "$health" | grep -q '"status": "ok"' && \
             printf '%s' "$health" | grep -q '"persistence": "ready"'; then
            echo "Hosted preview is operationally ready." >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s' "$health" | grep -q '"status": "unavailable"' && \
               printf '%s' "$health" | grep -q '"persistence": "migrations_pending"'; then
            echo "::warning::Hosted preview has pending migrations; validation continues without mutating the shared database."
            {
              echo "### Hosted preview readiness: migrations pending"
              echo
              echo "The deployment succeeded, but its configured shared PostgreSQL schema is behind the deployed code."
              echo "Validation remains non-blocking for this operator-owned migration state; all other readiness failures remain blocking."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Hosted preview is not operationally ready."
            exit 1
          fi

          if printf '%s' "$health" | grep -q '"status": "ok"' && \
             printf '%s' "$health" | grep -q '"persistence": "ready"'; then
            home="$(
              vercel curl / \
                --deployment "$DEPLOYMENT_URL" \
                --fail --silent
            )"
            printf '%s' "$home" | grep -q '/static/qbet_web/app.css'

            login="$(
              vercel curl /accounts/login/ \
                --deployment "$DEPLOYMENT_URL" \
                --fail --silent
            )"
            printf '%s' "$login" | grep -q '<form'

            vercel curl /static/qbet_web/app.css \
              --deployment "$DEPLOYMENT_URL" \
              --fail --silent \
              --output /dev/null
          elif printf '%s' "$health" | grep -q '"status": "unavailable"' && \
               printf '%s' "$health" | grep -q '"persistence": "migrations_pending"'; then
            echo "::warning::Hosted preview has pending migrations; skipping strict hosted smoke checks until schema is updated."
            {
              echo "### Hosted preview readiness: migrations pending"
              echo
              echo "Preview deployment succeeded, but shared database migrations are still pending."
              echo "Skipping strict smoke checks to keep deployment validation non-blocking until operators apply migrations."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Hosted preview is not operationally ready."
            exit 1
          fi
