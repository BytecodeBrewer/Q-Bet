name: Validation

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run Pyright
        run: python -m pyright

  test:
    name: Python and Django checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python -m pytest
      - name: Check Django configuration
        run: python manage.py check

  build:
    name: Package build
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Build distribution
        run: python -m build
      - name: Upload develop distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: q-bet-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy-preview:
    name: Vercel preview
    needs:
      - quality
      - test
      - build
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_NAME: q-bet
      QBET_DJANGO_SECRET_KEY: ${{ secrets.QBET_DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$QBET_DJANGO_SECRET_KEY" || {
            echo "Missing QBET_DJANGO_SECRET_KEY secret"
            exit 1
          }

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Ensure dedicated Q-Bet Vercel project
        shell: bash
        run: |
          if ! vercel project inspect "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            vercel project add "$VERCEL_PROJECT_NAME" \
              --scope "$VERCEL_ORG_ID" \
              --token "$VERCEL_TOKEN"
          fi
          vercel link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN"

      - name: Build hosted preview
        shell: bash
        env:
          QBET_HOSTED_PREVIEW: "true"
          QBET_DJANGO_DEBUG: "false"
          QBET_DJANGO_ALLOWED_HOSTS: ".vercel.app"
          QBET_SIMULATION_MODE_ENABLED: "false"
        run: vercel build --token "$VERCEL_TOKEN"

      - name: Deploy hosted preview
        id: deploy
        shell: bash
        run: |
          deployment_url="$(
            vercel deploy --prebuilt --yes \
              --token "$VERCEL_TOKEN" \
              --env QBET_HOSTED_PREVIEW=true \
              --env QBET_DJANGO_DEBUG=false \
              --env QBET_DJANGO_ALLOWED_HOSTS=.vercel.app \
              --env QBET_DJANGO_SECRET_KEY="$QBET_DJANGO_SECRET_KEY" \
              --env QBET_SIMULATION_MODE_ENABLED=false
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Vercel preview: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test hosted preview
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          health="$(
            vercel curl /health/ \
              --deployment "$DEPLOYMENT_URL" \
              --token "$VERCEL_TOKEN" \
              --fail --silent
          )"
          printf '%s' "$health" | grep -q '"status": "ok"'

          home="$(
            vercel curl / \
              --deployment "$DEPLOYMENT_URL" \
              --token "$VERCEL_TOKEN" \
              --fail --silent
          )"
          printf '%s' "$home" | grep -q '/static/qbet_web/app.css'

          vercel curl /static/qbet_web/app.css \
            --deployment "$DEPLOYMENT_URL" \
            --token "$VERCEL_TOKEN" \
            --fail --silent \
            --output /dev/null
