name: Validation

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  deployments: write

jobs:
  validation:
    name: PostgreSQL validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbet
          POSTGRES_PASSWORD: qbet
          POSTGRES_DB: qbet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbet -d qbet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_test
      QBET_TEST_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_test
      QBET_BUNQ_E2E: "0"
      QBET_RUN_PERFORMANCE: "0"
      QBET_SIMULATION_SPORTS_SOURCE: fixture
      QBET_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact validation head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "::error::Validation checkout $actual_sha does not match expected head $EXPECTED_SHA"
            exit 1
          }
          echo "Validated exact head: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Check pull request patch
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Check pushed patch
        if: github.event_name == 'push'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git diff --check HEAD^...HEAD
          else
            git diff --check "$before...${{ github.sha }}"
          fi
      - name: Verify isolated offline test boundary
        shell: bash
        run: |
          test "$QBET_BUNQ_E2E" = "0"
          test "$QBET_RUN_PERFORMANCE" = "0"
          test "$QBET_SIMULATION_SPORTS_SOURCE" = "fixture"
          test -z "${API_KEY_BUNQ:-}"
      - name: Verify PostgreSQL test target
        shell: bash
        run: |
          python - <<'PY'
          from qbet.web.settings import DATABASES

          database = DATABASES["default"]
          assert database["ENGINE"] == "django.db.backends.postgresql"
          assert database["HOST"] == "127.0.0.1"
          assert database["PORT"] == 5432
          assert database["NAME"] == "qbet_test"
          PY
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run Pyright
        run: python -m pyright
      - name: Check committed migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Verify migration plan is current
        run: python manage.py migrate --check
      - name: Run full standard Pytest suite with coverage
        run: >-
          python -m pytest
          --cov=src/qbet
          --cov-report=xml:coverage.xml
          --cov-report=
          --durations=20
      - name: Enforce repository coverage gate
        run: python -m coverage report
      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: q-bet-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Django configuration
        run: python manage.py check
      - name: Check hosted production security
        env:
          QBET_HOSTED_RUNTIME: "true"
          VERCEL_ENV: production
          QBET_DJANGO_SECRET_KEY: qbet-ci-hosted-security-secret-0123456789abcdefghijklmnopqrstuvwxyz
          QBET_DJANGO_DEBUG: "false"
          QBET_DJANGO_ALLOWED_HOSTS: q-bet.vercel.app
        run: python manage.py check --deploy
      - name: Build distribution
        run: python -m build
      - name: Upload develop distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: q-bet-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  performance:
    name: Phase 3 performance baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbet
          POSTGRES_PASSWORD: qbet
          POSTGRES_DB: qbet_performance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbet -d qbet_performance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_performance
      QBET_TEST_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_performance
      QBET_RUN_PERFORMANCE: "1"
      QBET_PERFORMANCE_OUTPUT: artifacts/phase3-performance-baseline.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run performance baseline
        run: python -m pytest -m performance tests/performance -s
      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: phase3-performance-baseline-${{ github.sha }}
          path: artifacts/phase3-performance-baseline.json
          if-no-files-found: error
          retention-days: 14

  vercel-build-check:
    name: Vercel candidate preflight
    needs:
      - validation
      - performance
    if: >-
      !cancelled() &&
      needs.validation.result == 'success' &&
      needs.performance.result == 'success' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      EXPECTED_RELEASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact Vercel build head
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_RELEASE" || {
            echo "::error::Vercel build checkout $actual_sha does not match expected head $EXPECTED_RELEASE"
            exit 1
          }
          echo "Checking Vercel buildability for exact head: $actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vercel Python build tooling
        run: |
          python -m pip install uv
          python -m pip install .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Vercel build configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Pull Vercel preview build configuration
        run: vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build Vercel candidate artifacts
        env:
          QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_build_only
          QBET_DJANGO_SECRET_KEY: qbet-ci-build-only-secret
          QBET_HOSTED_RUNTIME: "true"
          QBET_HOSTED_PREVIEW: "true"
          QBET_DJANGO_DEBUG: "false"
          QBET_DJANGO_ALLOWED_HOSTS: q-bet.vercel.app
          QBET_RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          QBET_SIMULATION_MODE_ENABLED: "false"
        run: vercel build --yes --token "$VERCEL_TOKEN"

      - name: Deploy protected Preview candidate
        id: candidate
        shell: bash
        run: |
          deployment_url="$(
            vercel deploy --prebuilt --yes \
              --token "$VERCEL_TOKEN" \
              --env QBET_HOSTED_RUNTIME=true \
              --env QBET_HOSTED_PREVIEW=true \
              --env QBET_DJANGO_DEBUG=false \
              --env QBET_DJANGO_ALLOWED_HOSTS=q-bet.vercel.app \
              --env QBET_RELEASE_SHA="$EXPECTED_RELEASE" \
              --env QBET_SIMULATION_MODE_ENABLED=false
          )"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Protected candidate Preview: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify candidate release and public runtime
        shell: bash
        run: |
          deployment_url="${{ steps.candidate.outputs.url }}"
          health=""
          for attempt in {1..12}; do
            health="$(vercel curl /health/ --deployment "$deployment_url" --silent || true)"
            if printf '%s' "$health" | grep -Fq "\"release\": \"$EXPECTED_RELEASE\""; then
              break
            fi
            sleep 5
          done

          if printf '%s' "$health" | grep -Fq '"readiness": "migrations_pending"'; then
            echo "::error::Candidate database has pending migrations. Apply them through the operator-controlled migration path before promotion."
            printf 'Candidate health response: %s\n' "$health"
            exit 1
          fi

          if ! printf '%s' "$health" | grep -Fq "\"release\": \"$EXPECTED_RELEASE\"" || \
             ! printf '%s' "$health" | grep -Fq '"status": "ok"' || \
             ! printf '%s' "$health" | grep -Fq '"persistence": "ready"' || \
             ! printf '%s' "$health" | grep -Fq '"readiness": "ready"'; then
            echo "::error::Candidate did not serve the exact healthy release $EXPECTED_RELEASE."
            printf 'Candidate health response: %s\n' "$health"
            exit 1
          fi

          home="$(vercel curl / --deployment "$deployment_url" --fail --silent)"
          printf '%s' "$home" | grep -q '/static/qbet_web/app.css'
          login="$(vercel curl /accounts/login/ --deployment "$deployment_url" --fail --silent)"
          printf '%s' "$login" | grep -q '<form'
          vercel curl /static/qbet_web/app.css \
            --deployment "$deployment_url" \
            --fail --silent --output /dev/null

          echo "Candidate serves exact release $EXPECTED_RELEASE with ready persistence and public runtime routes." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify authenticated candidate product routes
        shell: bash
        run: |
          deployment_url="${{ steps.candidate.outputs.url }}"

          session_key="$(
            vercel env run -e preview --token "$VERCEL_TOKEN" -- \
              python - <<'PY' | tail -n 1
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "qbet.web.settings")

          import django

          django.setup()

          from django.contrib.auth import get_user_model
          from django.test import Client

          username = "qbet-preview-smoke"
          User = get_user_model()
          user = User.objects.get(username=username)
          if not user.is_active or user.is_staff or user.is_superuser:
              raise SystemExit("preview smoke identity must be active and non-privileged")

          client = Client()
          client.force_login(user)
          session = client.session
          session.set_expiry(300)
          session.save()
          cookie = client.cookies.get("sessionid")
          if cookie is None or not cookie.value:
              raise SystemExit("preview smoke session was not created")
          print(cookie.value)
          PY
          )"

          test -n "$session_key" || {
            echo "::error::Could not create the ephemeral Preview smoke session."
            exit 1
          }

          cleanup_session() {
            vercel env run -e preview --token "$VERCEL_TOKEN" -- \
              python - "$session_key" <<'PY' >/dev/null 2>&1 || true
          import os
          import sys

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "qbet.web.settings")

          import django

          django.setup()

          from django.contrib.sessions.models import Session

          Session.objects.filter(session_key=sys.argv[1]).delete()
          PY
          }
          trap cleanup_session EXIT

          for route in /dashboard/ /reports/ /portfolio/; do
            route_status="$(
              vercel curl "$route" --deployment "$deployment_url" -- \
                --silent --show-error \
                --cookie "sessionid=$session_key" \
                --output /dev/null \
                --write-out "%{http_code}"
            )"
            test "$route_status" = "200" || {
              echo "::error::Authenticated candidate route $route returned HTTP $route_status."
              exit 1
            }
          done

          echo "Authenticated candidate Dashboard, Reports, and Portfolio routes passed with an ephemeral low-privilege Django session." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Vercel deployment
    needs:
      - validation
      - performance
      - vercel-build-check
    if: >-
      always() &&
      needs.validation.result == 'success' &&
      needs.performance.result == 'success' &&
      needs.vercel-build-check.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url || steps.deploy-production.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      EXPECTED_RELEASE: ${{ github.sha }}
      VERCEL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      IS_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
      STABLE_URL: https://q-bet.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact deployment head
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_RELEASE" || {
            echo "::error::Deployment checkout $actual_sha does not match expected head $EXPECTED_RELEASE"
            exit 1
          }
          echo "Preparing $VERCEL_ENVIRONMENT release: $actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vercel Python build tooling
        run: |
          python -m pip install uv

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Pull Vercel environment configuration
        run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token "$VERCEL_TOKEN"

      - name: Build Vercel preview artifacts
        if: github.ref == 'refs/heads/develop'
        env:
          QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_build_only
          QBET_DJANGO_SECRET_KEY: qbet-ci-build-only-secret
          QBET_HOSTED_RUNTIME: "true"
          QBET_HOSTED_PREVIEW: "true"
          QBET_DJANGO_DEBUG: "false"
          QBET_DJANGO_ALLOWED_HOSTS: q-bet.vercel.app
          QBET_RELEASE_SHA: ${{ github.sha }}
          QBET_SIMULATION_MODE_ENABLED: "false"
        run: vercel build --token "$VERCEL_TOKEN"

      - name: Build Vercel production artifacts
        if: github.ref == 'refs/heads/main'
        env:
          QBET_DATABASE_URL: postgresql://qbet:qbet@127.0.0.1:5432/qbet_build_only
          QBET_DJANGO_SECRET_KEY: qbet-ci-build-only-secret
          QBET_HOSTED_RUNTIME: "true"
          QBET_HOSTED_PREVIEW: "false"
          QBET_DJANGO_DEBUG: "false"
          QBET_DJANGO_ALLOWED_HOSTS: q-bet.vercel.app
          QBET_RELEASE_SHA: ${{ github.sha }}
          QBET_SIMULATION_MODE_ENABLED: "false"
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy preview from develop
        if: github.ref == 'refs/heads/develop'
        id: deploy
        shell: bash
        run: |
          deployment_url="$(
            vercel deploy --prebuilt --yes \
              --token "$VERCEL_TOKEN" \
              --env QBET_HOSTED_RUNTIME=true \
              --env QBET_HOSTED_PREVIEW=true \
              --env QBET_DJANGO_DEBUG=false \
              --env QBET_DJANGO_ALLOWED_HOSTS=q-bet.vercel.app \
              --env QBET_RELEASE_SHA="$EXPECTED_RELEASE" \
              --env QBET_SIMULATION_MODE_ENABLED=false
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Vercel preview deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production from main
        if: github.ref == 'refs/heads/main'
        id: deploy-production
        shell: bash
        run: |
          deployment_url="$(
            vercel deploy --prebuilt --prod --yes \
              --token "$VERCEL_TOKEN" \
              --env QBET_HOSTED_RUNTIME=true \
              --env QBET_HOSTED_PREVIEW=false \
              --env QBET_DJANGO_DEBUG=false \
              --env QBET_DJANGO_ALLOWED_HOSTS=q-bet.vercel.app \
              --env QBET_RELEASE_SHA="$EXPECTED_RELEASE" \
              --env QBET_SIMULATION_MODE_ENABLED=false
          )"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Vercel Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production release health
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          health=""
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error "$STABLE_URL/health/" || true)"
            if printf '%s' "$health" | grep -Fq "\"release\": \"$EXPECTED_RELEASE\"" &&                printf '%s' "$health" | grep -Fq '"status": "ok"' &&                printf '%s' "$health" | grep -Fq '"persistence": "ready"' &&                printf '%s' "$health" | grep -Fq '"readiness": "ready"'; then
              break
            fi
            sleep 5
          done

          if ! printf '%s' "$health" | grep -Fq "\"release\": \"$EXPECTED_RELEASE\"" || \
             ! printf '%s' "$health" | grep -Fq '"status": "ok"' || \
             ! printf '%s' "$health" | grep -Fq '"persistence": "ready"' || \
             ! printf '%s' "$health" | grep -Fq '"readiness": "ready"'; then
            echo "::error::$VERCEL_ENVIRONMENT did not serve healthy release $EXPECTED_RELEASE."
            printf 'Last health response: %s\n' "$health"
            exit 1
          fi

          home="$(curl --fail --silent --show-error "$STABLE_URL/")"
          printf '%s' "$home" | grep -q '/static/qbet_web/app.css'
          login="$(curl --fail --silent --show-error "$STABLE_URL/accounts/login/")"
          printf '%s' "$login" | grep -q '<form'
          curl --fail --silent --show-error "$STABLE_URL/static/qbet_web/app.css" --output /dev/null

          echo "Production serves exact release $EXPECTED_RELEASE and passed hosted smoke checks." >> "$GITHUB_STEP_SUMMARY"
