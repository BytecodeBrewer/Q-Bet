[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-bet"
version = "0.1.0"
description = "A modular Python quant engine for matched betting and strategy simulation."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
    "pydantic>=2.11,<3",
]

[tool.vercel]
entrypoint = "qbet.web.wsgi:application"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src"]
exclude = ["src/qbet/web/migrations"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
