{% extends "qbet_web/base.html" %}
{% block content %}
<section class="content-section auth-form">
  <h1>Choose a new password</h1>
  {% if validlink %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary" type="submit">Set new password</button></form>
  {% else %}
    <p>This reset link is invalid or has expired.</p>
  {% endif %}
</section>
{% endblock %}
