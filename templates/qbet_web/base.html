{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Q-Bet{% endblock %}</title><link rel="stylesheet" href="{% static 'qbet_web/app.css' %}"></head><body><header class="site-header"><a class="brand" href="{% url 'home' %}">Q-Bet</a><nav>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'monitoring' %}">Monitoring</a>{% if user.is_staff %}<a href="{% url 'admin-area' %}">Admin</a>{% endif %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form>{% else %}<a href="{% url 'login' %}">Sign in</a><a href="{% url 'register' %}">Register</a>{% endif %}</nav></header><main>{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
