{% extends "qbet_web/base.html" %}
{% block content %}<section class="page-heading"><p><a href="{% url 'admin-area' %}">Admin</a></p><h1>GUI availability</h1><p>Only this presentation feature is configured here. It does not start or stop a simulation.</p></section><form method="post" class="settings-form">{% csrf_token %}<fieldset><legend>Simulation area</legend>{{ form.simulation_enabled }} <label for="{{ form.simulation_enabled.id_for_label }}">Show the simulation area to signed-in users</label></fieldset><button class="primary" type="submit">Save availability</button></form>{% endblock %}
