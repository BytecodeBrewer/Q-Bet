{% extends "qbet_web/base.html" %}
{% block content %}
<section class="page-heading"><h1>Q-Bet</h1><p>Read-only monitoring for the current v1 engines.</p></section>
<section class="engine-grid" aria-label="Available engines">
  {% for engine in monitoring.engines %}
    <article class="engine-card">
      <h2>{{ engine.name }}</h2>
      <p><span class="status status-{{ engine.status }}"></span>{{ engine.detail }}</p>
    </article>
  {% endfor %}
</section>
<p><a class="button-link" href="{% url 'monitoring' %}">Open monitoring</a></p>
{% endblock %}
